<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
    <stop stop-color="#04262B"/><stop offset="0.55" stop-color="#073B42"/><stop offset="1" stop-color="#0B4F57"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#3DD6B5"/><stop offset="1" stop-color="#0E8C8C"/>
  </linearGradient>
  <linearGradient id="activeChip" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#14A3A3"/><stop offset="1" stop-color="#3DD6B5"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1700 120) scale(900)">
    <stop stop-color="#3DD6B5" stop-opacity="0.30"/><stop offset="1" stop-color="#3DD6B5" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%" color-interpolation-filters="sRGB">
